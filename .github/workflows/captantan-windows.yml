---
# captantan fork: the only workflow in this fork (upstream's are removed, see CAPTANTAN.md).
# Builds the Windows AMD64 installer, unsigned, and publishes it as a GitHub release.
# The build steps follow upstream's ci-windows.yml (MSYS2 UCRT64, cmake/ninja, cpack -G WIX).
name: captantan Windows build
permissions: {}

on:
  push:
    tags:
      - 'v*-captantan.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing v*-captantan.N tag to build and release. Empty: build the chosen branch, no release.'
        required: false
        default: ''

concurrency:
  group: captantan-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.v.outputs.ref }}
      tag: ${{ steps.v.outputs.tag }}
      build_version: ${{ steps.v.outputs.build_version }}
    steps:
      - name: Work out the tag and the version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${EVENT}" == "push" ]]; then
            tag="${REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          fi

          if [[ -n "${tag}" ]]; then
            # v2026.914.233613-captantan.1 -> 2026.914.233613 (upstream's version, so its version
            # parsing, the MSI version and the update check keep working; our suffix stays in the
            # tag and the release name only).
            if [[ ! "${tag}" =~ ^v([0-9]{4}\.[0-9]{3,4}\.[0-9]+)-captantan\.[0-9]+$ ]]; then
              echo "::error::Tag '${tag}' is not of the form vYYYY.MDD.N-captantan.N"
              exit 1
            fi
            build_version="${BASH_REMATCH[1]}"
            ref="refs/tags/${tag}"
          else
            build_version=""
            ref="${REF}"
          fi

          {
            echo "tag=${tag}"
            echo "ref=${ref}"
            echo "build_version=${build_version}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag='${tag}' ref='${ref}' build_version='${build_version}'"

  script_test:
    name: Test vdd-prepare.ps1
    needs: version
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - name: Run the script against VDD's sample settings (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'vdd-test'
          New-Item -ItemType Directory -Path $t -Force | Out-Null
          $xml = Join-Path $t 'vdd_settings.xml'
          Copy-Item captantan/test/vdd_settings.sample.xml $xml
          $script = (Resolve-Path captantan/vdd-prepare.ps1).Path

          function Run([int]$W, [int]$H, [int]$F) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script `
              -Width $W -Height $H -Fps $F -SettingsPath $xml -LogDir $t -NoRestart
            if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE for ${W}x${H}@${F}" }
          }
          function Modes {
            $d = [xml](Get-Content -Raw $xml)
            $g = @($d.vdd_settings.global.g_refresh_rate | ForEach-Object { [int]$_ })
            $r = @($d.vdd_settings.resolutions.resolution | ForEach-Object { '{0}x{1}@{2}' -f $_.width, $_.height, $_.refresh_rate })
            return @{ g = $g; r = $r }
          }

          # 1. A new resolution at a rate already in the global list: one resolution added, no rate.
          Run 2960 1848 120
          $m = Modes
          if ($m.r -notcontains '2960x1848@120') { throw "resolution not added: $($m.r)" }
          if ($m.g.Count -ne 6) { throw "global list changed: $($m.g)" }

          # 2. Same again: the file must not change.
          $before = (Get-FileHash $xml).Hash
          Run 2960 1848 120
          if ((Get-FileHash $xml).Hash -ne $before) { throw 'file changed on a repeat run' }

          # 3. A known resolution at a new rate: the rate goes into the global list only.
          Run 1920 1080 75
          $m = Modes
          if ($m.g -notcontains 75) { throw "rate not added: $($m.g)" }
          if (@($m.r | Where-Object { $_ -like '1920x1080@*' }).Count -ne 1) { throw "1920x1080 duplicated: $($m.r)" }

          # 4. Comments and the original layout survive, and the order the driver needs is kept.
          $raw = Get-Content -Raw $xml
          if ($raw -notmatch 'RESOLUTION CONFIGURATION') { throw 'comments lost' }
          if ($raw -notmatch '<width>2960</width>\s*<height>1848</height>\s*<refresh_rate>120</refresh_rate>') { throw 'element order wrong' }

          # 5. As Sunshine runs it: from the installed layout, input only from SUNSHINE_CLIENT_*, log in the
          #    default folder (Sunshine's config folder, two levels up). Tests 1-4 pass everything as parameters.
          $inst = Join-Path $t 'Sunshine'
          New-Item -ItemType Directory -Force -Path (Join-Path $inst 'scripts\captantan'), (Join-Path $inst 'config') | Out-Null
          $installed = Join-Path $inst 'scripts\captantan\vdd-prepare.ps1'
          Copy-Item $script $installed
          $env:SUNSHINE_CLIENT_WIDTH = '1280'; $env:SUNSHINE_CLIENT_HEIGHT = '800'; $env:SUNSHINE_CLIENT_FPS = '60'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installed -SettingsPath $xml -NoRestart
          $code = $LASTEXITCODE
          Remove-Item Env:SUNSHINE_CLIENT_WIDTH, Env:SUNSHINE_CLIENT_HEIGHT, Env:SUNSHINE_CLIENT_FPS
          if ($code -ne 0) { throw "exit $code when run the way Sunshine runs it" }
          $log5 = Join-Path $inst 'config\vdd-prepare.log'
          if (-not (Select-String -Path $log5 -Pattern 'start: 1280x800@60' -Quiet)) { throw "no start line in $log5" }
          if ((Modes).r -notcontains '1280x800@60') { throw 'resolution from SUNSHINE_CLIENT_* not added' }

          # 6. Missing input fails with the script's own exit 1 (not a PowerShell error, which is also 1).
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -SettingsPath $xml -LogDir $t -NoRestart
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 without input, got $LASTEXITCODE" }
          if (-not (Select-String -Path (Join-Path $t 'vdd-prepare.log') -Pattern 'width, height or fps missing' -Quiet)) { throw 'exit 1 without the script saying why' }

          Get-Content $xml | Select-Object -First 50
          Get-Content (Join-Path $t 'vdd-prepare.log')
          Get-Content $log5
          exit 0  # test 6 left LASTEXITCODE at 1 on purpose

  build_windows:
    name: Windows-AMD64
    needs: [version, script_test]
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget

      - name: Update Windows dependencies
        env:
          TOOLCHAIN: ucrt-x86_64
        # Keep this list the same as upstream's ci-windows.yml (ucrt64): the build needs packages that only
        # come in as dependencies of these (libtiff-4 for static Qt arrives with graphviz).
        run: |
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-boost"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-doxygen"
            "mingw-w64-${TOOLCHAIN}-gcc"
            "mingw-w64-${TOOLCHAIN}-graphviz"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
            "mingw-w64-${TOOLCHAIN}-qt6-static"
            "mingw-w64-${TOOLCHAIN}-MinHook"
            "mingw-w64-${TOOLCHAIN}-nsis"
          )
          pacman -Syu --noconfirm "${dependencies[@]}"

      - name: Setup dotnet  # needed for wix
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'

      - name: NodeJS Path
        shell: pwsh
        run: |
          $NODEJS_PATH = Split-Path -Path (Get-Command node).Source -Parent
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Sync Python tools
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --no-python-downloads --no-install-project

      - name: Build Windows
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"
          export COMMIT="$(git rev-parse HEAD)"  # the commit being built (a tag, or the branch)

          # BUILD_WERROR is off (upstream CI has it on): MSYS2 is rolling, so a release tag soon meets newer
          # libraries whose deprecations would fail the build (v2026.914.233613 vs OpenSSL 4.1, ASN1_STRING_length).
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_WERROR=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${GITHUB_REPOSITORY}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues"
          echo "::add-matcher::.github/matchers/gcc.json"
          ninja -C build
          echo "::remove-matcher owner=gcc::"

      - name: Check Windows linkage
        run: |
          set -euo pipefail
          unexpected=""
          for binary in build/sunshine.exe build/tools/audio-info.exe build/tools/dxgi-info.exe build/tools/sunshinesvc.exe; do
            linkage="$(ldd "${binary}")"
            bad="$(awk '
              BEGIN { IGNORECASE = 1 }
              $1 == "zlib1.dll" { next }
              $1 ~ /^minhook-detours\..*\.dll$/ { next }
              $1 ~ /^api-ms-win-/ { next }
              $1 ~ /^ext-ms-win-/ { next }
              $0 ~ /=>[[:space:]]+not found/ { print }
              $0 ~ /=>[[:space:]]+\/(clangarm64|clang64|mingw32|mingw64|ucrt64)\/bin\// { print }
            ' <<< "${linkage}")"
            if [[ -n "${bad}" ]]; then unexpected="${unexpected}"$'\n'"${binary}:"$'\n'"${bad}"; fi
          done
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected non-packaged runtime dependencies:${unexpected}"
            exit 1
          fi

      - name: Package Windows
        run: |
          mkdir -p artifacts
          cd build
          cpack -G WIX
          mv ./cpack_artifacts/Sunshine.msi ../artifacts/Sunshine-Windows-AMD64-installer.msi

      - name: Check the installer holds the VDD script
        shell: pwsh
        run: |
          $wxs = Get-ChildItem -Recurse build/cpack_artifacts/_CPack_Packages -Filter *.wxs | Select-String -Pattern 'vdd-prepare.ps1' -List
          if (-not $wxs) { throw 'vdd-prepare.ps1 is not in the WiX sources' }
          $wxs | ForEach-Object { $_.Path }

      - name: Debug wix
        if: always()
        run: cat ./build/cpack_artifacts/_CPack_Packages/win64/WIX/wix.log || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-Windows-AMD64
          path: artifacts/
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build_windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-Windows-AMD64
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          BASE: ${{ needs.version.outputs.build_version }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum Sunshine-Windows-AMD64-installer.msi > Sunshine-Windows-AMD64-installer.msi.sha256
          hash="$(cut -d' ' -f1 Sunshine-Windows-AMD64-installer.msi.sha256)"
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .sha)"
          cat > notes.md <<EOF
          Sunshine v${BASE} (upstream stable) with the captantan \`pre_display_cmd\` hook and the VDD script.
          See [CAPTANTAN.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CAPTANTAN.md).

          - Installer: \`Sunshine-Windows-AMD64-installer.msi\` (unsigned; Smart App Control blocks it)
          - SHA-256: \`${hash}\`
          - Commit: \`${commit}\`
          - Sunshine reports its version as upstream's, \`${BASE}\`.

          Check the download in PowerShell: \`(Get-FileHash .\\Sunshine-Windows-AMD64-installer.msi).Hash\`
          EOF
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Sunshine ${TAG#v}" \
            --notes-file notes.md \
            Sunshine-Windows-AMD64-installer.msi \
            Sunshine-Windows-AMD64-installer.msi.sha256
